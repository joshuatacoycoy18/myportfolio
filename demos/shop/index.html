<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urban Threads — Modern Essentials</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:#0a0f1c;color:#e2e8f0;line-height:1.6}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:100;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;background:rgba(10,15,28,.9);backdrop-filter:blur(14px);border-bottom:1px solid #1e293b}
.nav strong{font-weight:800;letter-spacing:-.5px;font-size:1.15rem}
.nav strong span{color:#0ea5e9}
.nav-right{display:flex;gap:.5rem;align-items:center}
.icon-btn{background:transparent;border:1px solid #1e293b;color:#e2e8f0;width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:1rem;position:relative;transition:.2s}
.icon-btn:hover{border-color:#0ea5e9;color:#0ea5e9}
.icon-btn .badge{position:absolute;top:-5px;right:-5px;background:#0ea5e9;color:#0a0f1c;font-size:.65rem;font-weight:700;padding:.1rem .35rem;border-radius:99px;min-width:18px;text-align:center}
.wrap{max-width:1200px;margin:0 auto;padding:2rem 1.5rem}
.hero{text-align:center;padding:3rem 1.5rem 1rem}
.hero h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-1px;margin-bottom:.5rem}
.hero p{color:#94a3b8;font-size:.95rem}
.toolbar{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin:2rem 0}
.filters{display:flex;gap:.4rem;flex-wrap:wrap}
.filters button{padding:.5rem 1.1rem;border:1px solid #1e293b;background:transparent;color:#94a3b8;border-radius:99px;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:500;transition:.25s}
.filters button:hover{border-color:#0ea5e9;color:#0ea5e9}
.filters button.active{background:#0ea5e9;border-color:#0ea5e9;color:#0a0f1c;font-weight:600}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:.7rem 1rem .7rem 2.5rem;border-radius:10px;border:1px solid #1e293b;background:#111a2e;color:#e2e8f0;font-family:inherit;font-size:.9rem;outline:none;transition:.2s}
.search input:focus{border-color:#0ea5e9}
.search::before{content:"🔍";position:absolute;left:.9rem;top:50%;transform:translateY(-50%);font-size:.9rem;opacity:.5}
.sort{padding:.7rem 1rem;border-radius:10px;border:1px solid #1e293b;background:#111a2e;color:#e2e8f0;font-family:inherit;font-size:.85rem;cursor:pointer;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem}
.prod{background:#111a2e;border:1px solid #1e293b;border-radius:14px;overflow:hidden;transition:.3s;position:relative;cursor:pointer}
.prod:hover{transform:translateY(-6px);border-color:#0ea5e9;box-shadow:0 20px 40px rgba(14,165,233,.15)}
.prod-img{height:200px;display:grid;place-items:center;font-size:4rem;position:relative;overflow:hidden}
.prod-img::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.15),transparent 60%)}
.sale-badge{position:absolute;top:.75rem;left:.75rem;background:#ef4444;color:#fff;font-size:.65rem;font-weight:800;padding:.25rem .6rem;border-radius:99px;letter-spacing:.5px;z-index:2}
.wish-btn{position:absolute;top:.75rem;right:.75rem;background:rgba(15,23,42,.7);backdrop-filter:blur(8px);border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;color:#94a3b8;font-size:1rem;transition:.2s;z-index:2;display:grid;place-items:center}
.wish-btn:hover,.wish-btn.active{color:#f43f5e;background:rgba(244,63,94,.15)}
.prod-body{padding:1rem}
.prod-body .cat{font-size:.7rem;color:#0ea5e9;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.prod-body h3{font-size:1rem;margin:.35rem 0 .4rem;font-weight:700}
.stars{color:#fbbf24;font-size:.8rem;margin-bottom:.5rem}
.stars span{color:#64748b;font-size:.75rem;margin-left:.3rem}
.prod-body .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:.75rem}
.prod-body .price{color:#0ea5e9;font-weight:800;font-size:1.05rem}
.prod-body .old{color:#64748b;font-size:.78rem;text-decoration:line-through;margin-left:.4rem;font-weight:400}
.prod-body .add{background:#0ea5e9;color:#0a0f1c;border:none;padding:.45rem 1rem;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.8rem;transition:.2s}
.prod-body .add:hover{background:#38bdf8}
.empty{text-align:center;color:#64748b;padding:4rem;grid-column:1/-1}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,15,28,.85);backdrop-filter:blur(10px);display:none;place-items:center;z-index:200;padding:1.5rem;overflow-y:auto}
.modal.open{display:grid}
.modal-box{background:#111a2e;border:1px solid #1e293b;border-radius:20px;max-width:900px;width:100%;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;animation:pop .3s ease;max-height:90vh;position:relative}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal-img{background:linear-gradient(135deg,#1e293b,#0ea5e9);display:grid;place-items:center;font-size:8rem;min-height:400px}
.modal-body{padding:2.5rem;overflow-y:auto}
.modal-close{position:absolute;top:1rem;right:1rem;background:rgba(15,23,42,.7);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.3rem;cursor:pointer;z-index:3}
.modal-body .cat{font-size:.72rem;color:#0ea5e9;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.modal-body h3{font-size:1.6rem;margin:.5rem 0;letter-spacing:-.5px}
.modal-body .meta{color:#94a3b8;font-size:.9rem;margin-bottom:1rem}
.modal-body .price-row{display:flex;align-items:center;gap:.75rem;margin:1rem 0}
.modal-body .price{font-size:1.6rem;font-weight:800;color:#0ea5e9}
.modal-body .opt-label{font-size:.78rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#94a3b8;margin:1.25rem 0 .5rem;display:block}
.opt-row{display:flex;gap:.5rem;flex-wrap:wrap}
.opt-row button{min-width:44px;padding:.5rem .9rem;border:1px solid #1e293b;background:#0a0f1c;color:#e2e8f0;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:600;transition:.2s}
.opt-row button:hover{border-color:#0ea5e9}
.opt-row button.active{background:#0ea5e9;color:#0a0f1c;border-color:#0ea5e9}
.modal-actions{display:flex;gap:.75rem;margin-top:1.75rem}
.modal-actions .add{flex:1;background:#0ea5e9;color:#0a0f1c;padding:.9rem;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.92rem;border:none;transition:.2s}
.modal-actions .add:hover{background:#38bdf8}
.modal-actions .wish{background:transparent;border:1px solid #1e293b;color:#e2e8f0;width:48px;border-radius:10px;cursor:pointer;font-size:1.1rem;transition:.2s}
.modal-actions .wish:hover,.modal-actions .wish.active{border-color:#f43f5e;color:#f43f5e}
/* Cart panel */
.cart-panel{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100vw;background:#111a2e;border-left:1px solid #1e293b;transform:translateX(100%);transition:.35s;z-index:250;display:flex;flex-direction:column}
.cart-panel.open{transform:translateX(0)}
.cart-header{padding:1.5rem;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
.cart-header h3{font-size:1.1rem;font-weight:700}
.cart-close{background:none;border:none;color:#94a3b8;font-size:1.5rem;cursor:pointer}
.cart-items{flex:1;overflow-y:auto;padding:1.5rem}
.cart-empty{text-align:center;color:#64748b;padding:3rem 1rem}
.cart-item{display:flex;gap:.75rem;padding:.75rem 0;border-bottom:1px solid #1e293b}
.cart-item .thumb{width:56px;height:56px;border-radius:10px;background:#0a0f1c;display:grid;place-items:center;font-size:1.6rem;flex-shrink:0}
.cart-item .info{flex:1;font-size:.85rem}
.cart-item .info b{display:block;font-size:.9rem;margin-bottom:.2rem}
.cart-item .info .opts{color:#64748b;font-size:.75rem}
.cart-item .qty{display:flex;align-items:center;gap:.4rem;margin-top:.4rem}
.cart-item .qty button{width:22px;height:22px;border-radius:50%;border:1px solid #334155;background:transparent;color:#e2e8f0;cursor:pointer;font-weight:700;font-size:.75rem}
.cart-item .right{text-align:right}
.cart-item .price{color:#0ea5e9;font-weight:700;font-size:.9rem}
.cart-item .remove{background:none;border:none;color:#64748b;font-size:.75rem;cursor:pointer;margin-top:.4rem}
.cart-item .remove:hover{color:#f43f5e}
.cart-footer{padding:1.5rem;border-top:1px solid #1e293b}
.cart-total{display:flex;justify-content:space-between;font-weight:700;margin-bottom:.5rem;font-size:1.05rem}
.cart-total span:last-child{color:#0ea5e9}
.cart-note{color:#64748b;font-size:.78rem;margin-bottom:1rem}
.cart-checkout{width:100%;background:#0ea5e9;color:#0a0f1c;border:none;padding:.9rem;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.95rem;transition:.2s}
.cart-checkout:hover{background:#38bdf8}
.overlay{position:fixed;inset:0;background:rgba(10,15,28,.5);opacity:0;pointer-events:none;transition:.3s;z-index:240}
.overlay.show{opacity:1;pointer-events:auto}
footer{text-align:center;padding:3rem 1.5rem;color:#64748b;font-size:.85rem;border-top:1px solid #1e293b;margin-top:4rem}
@media(max-width:700px){.modal-box{grid-template-columns:1fr}.modal-img{min-height:220px;font-size:5rem}}
</style>
</head>
<body>

<nav class="nav">
  <a href="#" class="logo"><strong>urban<span>threads</span></strong></a>
  <div class="nav-right">
    <button class="icon-btn" id="wishBtn" title="Wishlist">❤️ <span class="badge" id="wishCount">0</span></button>
    <button class="icon-btn" id="cartBtn" title="Cart">🛒 <span class="badge" id="cartCount">0</span></button>
  </div>
</nav>

<div class="hero">
  <h1>Modern essentials,<br>built to last.</h1>
  <p>Thoughtfully designed clothing for everyday life.</p>
</div>

<div class="wrap">
  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="active" data-cat="all">All</button>
      <button data-cat="top">Tops</button>
      <button data-cat="bottom">Bottoms</button>
      <button data-cat="acc">Accessories</button>
    </div>
    <div class="search"><input id="searchInput" type="search" placeholder="Search products..."></div>
    <select class="sort" id="sortSelect">
      <option value="featured">Featured</option>
      <option value="low">Price: Low → High</option>
      <option value="high">Price: High → Low</option>
      <option value="rating">Top rated</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
</div>

<footer>© 2026 Urban Threads · Demo for portfolio showcase</footer>

<!-- Product Modal -->
<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-img" id="mImg"></div>
    <div class="modal-body">
      <span class="cat" id="mCat"></span>
      <h3 id="mName"></h3>
      <div class="stars" id="mStars"></div>
      <p class="meta" id="mDesc"></p>
      <div class="price-row">
        <span class="price" id="mPrice"></span>
        <span class="old" id="mOld" style="text-decoration:line-through;color:#64748b"></span>
      </div>
      <span class="opt-label">Size</span>
      <div class="opt-row" id="mSizes"></div>
      <span class="opt-label">Color</span>
      <div class="opt-row" id="mColors"></div>
      <div class="modal-actions">
        <button class="add" id="mAdd">Add to cart</button>
        <button class="wish" id="mWish">♡</button>
      </div>
    </div>
  </div>
</div>

<!-- Cart Panel -->
<aside class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3>Your cart</h3>
    <button class="cart-close" id="cartClose">×</button>
  </div>
  <div class="cart-items" id="cartItems"><p class="cart-empty">Your cart is empty.</p></div>
  <div class="cart-footer">
    <div class="cart-total"><span>Subtotal</span><span id="cartTotal">₱0</span></div>
    <p class="cart-note">Shipping &amp; taxes calculated at checkout.</p>
    <button class="cart-checkout" id="checkoutBtn">Checkout →</button>
  </div>
</aside>

<div class="overlay" id="overlay"></div>

<script>
const products=[
  {id:1,name:"Classic Tee",cat:"top",emoji:"👕",price:590,old:790,rating:4.7,reviews:128,desc:"100% combed cotton. Relaxed fit.",sizes:["S","M","L","XL"],colors:["#0a0f1c","#ffffff","#0ea5e9"],grad:"linear-gradient(135deg,#1e293b,#0ea5e9)"},
  {id:2,name:"Heavy Hoodie",cat:"top",emoji:"🧥",price:1290,rating:4.9,reviews:342,desc:"Fleece-lined, oversized fit.",sizes:["S","M","L","XL"],colors:["#0a0f1c","#64748b","#7c3aed"],grad:"linear-gradient(135deg,#1e293b,#7c3aed)"},
  {id:3,name:"Denim Jacket",cat:"top",emoji:"🧥",price:1890,old:2290,rating:4.6,reviews:97,desc:"Vintage wash, mid-weight denim.",sizes:["S","M","L"],colors:["#1e3a8a","#0a0f1c"],grad:"linear-gradient(135deg,#1e3a8a,#60a5fa)"},
  {id:4,name:"Slim Jeans",cat:"bottom",emoji:"👖",price:1490,rating:4.5,reviews:214,desc:"Stretch denim, tapered leg.",sizes:["28","30","32","34"],colors:["#1e293b","#0a0f1c"],grad:"linear-gradient(135deg,#1e293b,#475569)"},
  {id:5,name:"Cargo Pants",cat:"bottom",emoji:"👖",price:1290,rating:4.4,reviews:156,desc:"Utility pockets, adjustable cuffs.",sizes:["28","30","32","34"],colors:["#365314","#0a0f1c"],grad:"linear-gradient(135deg,#365314,#84cc16)"},
  {id:6,name:"Snapback Cap",cat:"acc",emoji:"🧢",price:490,rating:4.8,reviews:88,desc:"Adjustable strap, embroidered logo.",sizes:["One size"],colors:["#0a0f1c","#0ea5e9","#ef4444"],grad:"linear-gradient(135deg,#0f172a,#0ea5e9)"},
  {id:7,name:"Canvas Tote",cat:"acc",emoji:"👜",price:690,rating:4.6,reviews:64,desc:"Heavy canvas, reinforced handles.",sizes:["One size"],colors:["#d6b48a","#0a0f1c"],grad:"linear-gradient(135deg,#78350f,#d6b48a)"},
  {id:8,name:"Runner Sneakers",cat:"acc",emoji:"👟",price:2490,old:2990,rating:4.9,reviews:412,desc:"Lightweight, cushioned sole.",sizes:["7","8","9","10","11"],colors:["#ffffff","#0a0f1c","#f43f5e"],grad:"linear-gradient(135deg,#0a0f1c,#f43f5e)"}
];

let state={cat:"all",q:"",sort:"featured",cart:{},wish:new Set()};
const grid=document.getElementById('grid');

function starStr(r){
  const full=Math.floor(r);
  const half=r-full>=.5?1:0;
  return '★'.repeat(full)+(half?'⯨':'')+'☆'.repeat(5-full-half);
}

function getFiltered(){
  let list=products.filter(p=>(state.cat==="all"||p.cat===state.cat)&&p.name.toLowerCase().includes(state.q));
  if(state.sort==="low")list.sort((a,b)=>a.price-b.price);
  if(state.sort==="high")list.sort((a,b)=>b.price-a.price);
  if(state.sort==="rating")list.sort((a,b)=>b.rating-a.rating);
  return list;
}

function render(){
  const list=getFiltered();
  grid.innerHTML=list.length?list.map(p=>`
    <div class="prod" data-id="${p.id}">
      <div class="prod-img" style="background:${p.grad}">
        ${p.old?`<span class="sale-badge">SALE</span>`:''}
        <button class="wish-btn ${state.wish.has(p.id)?'active':''}" data-wish="${p.id}">${state.wish.has(p.id)?'❤':'♡'}</button>
        ${p.emoji}
      </div>
      <div class="prod-body">
        <span class="cat">${p.cat}</span>
        <h3>${p.name}</h3>
        <div class="stars">${starStr(p.rating)}<span>(${p.reviews})</span></div>
        <div class="bottom">
          <div><span class="price">₱${p.price}</span>${p.old?`<span class="old">₱${p.old}</span>`:''}</div>
          <button class="add" data-add="${p.id}">Add</button>
        </div>
      </div>
    </div>`).join(''):'<p class="empty">No products match your search.</p>';

  grid.querySelectorAll('.prod').forEach(c=>c.onclick=e=>{
    if(e.target.closest('[data-add]')||e.target.closest('[data-wish]'))return;
    openModal(+c.dataset.id);
  });
  grid.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    addToCart(+b.dataset.add,'M','#0a0f1c');
  });
  grid.querySelectorAll('[data-wish]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const id=+b.dataset.wish;
    if(state.wish.has(id))state.wish.delete(id);else state.wish.add(id);
    updateWishCount();
    render();
  });
}

function updateWishCount(){document.getElementById('wishCount').textContent=state.wish.size;}

// Modal
const modal=document.getElementById('modal');
let currentProduct=null,currentSize='M',currentColor='#0a0f1c';

function openModal(id){
  currentProduct=products.find(p=>p.id===id);
  currentSize=currentProduct.sizes[0];
  currentColor=currentProduct.colors[0];
  document.getElementById('mImg').style.background=currentProduct.grad;
  document.getElementById('mImg').textContent=currentProduct.emoji;
  document.getElementById('mCat').textContent=currentProduct.cat;
  document.getElementById('mName').textContent=currentProduct.name;
  document.getElementById('mStars').innerHTML=starStr(currentProduct.rating)+`<span>(${currentProduct.reviews} reviews)</span>`;
  document.getElementById('mDesc').textContent=currentProduct.desc;
  document.getElementById('mPrice').textContent='₱'+currentProduct.price;
  document.getElementById('mOld').textContent=currentProduct.old?'₱'+currentProduct.old:'';
  document.getElementById('mSizes').innerHTML=currentProduct.sizes.map(s=>`<button class="${s===currentSize?'active':''}" data-size="${s}">${s}</button>`).join('');
  document.getElementById('mColors').innerHTML=currentProduct.colors.map(c=>`<button class="${c===currentColor?'active':''}" data-color="${c}" style="background:${c}"></button>`).join('');
  document.getElementById('mWish').textContent=state.wish.has(id)?'❤':'♡';
  document.getElementById('mWish').classList.toggle('active',state.wish.has(id));
  modal.classList.add('open');
  document.body.style.overflow='hidden';

  document.querySelectorAll('#mSizes button').forEach(b=>b.onclick=()=>{
    currentSize=b.dataset.size;
    document.querySelectorAll('#mSizes button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
  document.querySelectorAll('#mColors button').forEach(b=>b.onclick=()=>{
    currentColor=b.dataset.color;
    document.querySelectorAll('#mColors button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
}
document.getElementById('modalClose').onclick=()=>{modal.classList.remove('open');document.body.style.overflow='';};
modal.onclick=e=>{if(e.target===modal){modal.classList.remove('open');document.body.style.overflow='';}};
document.getElementById('mAdd').onclick=()=>{addToCart(currentProduct.id,currentSize,currentColor);modal.classList.remove('open');document.body.style.overflow='';};
document.getElementById('mWish').onclick=()=>{
  const id=currentProduct.id;
  if(state.wish.has(id))state.wish.delete(id);else state.wish.add(id);
  document.getElementById('mWish').textContent=state.wish.has(id)?'❤':'♡';
  document.getElementById('mWish').classList.toggle('active',state.wish.has(id));
  updateWishCount();render();
};

// Cart
function addToCart(id,size,color){
  const key=id+'|'+size+'|'+color;
  if(!state.cart[key])state.cart[key]={id,size,color,qty:0};
  state.cart[key].qty++;
  updateCart();
}
function updateCart(){
  const entries=Object.values(state.cart);
  document.getElementById('cartCount').textContent=entries.reduce((s,e)=>s+e.qty,0);
  const el=document.getElementById('cartItems');
  if(!entries.length){el.innerHTML='<p class="cart-empty">Your cart is empty.</p>';document.getElementById('cartTotal').textContent='₱0';return;}
  let total=0;
  el.innerHTML=entries.map((e,i)=>{
    const p=products.find(x=>x.id===e.id);
    total+=p.price*e.qty;
    return `<div class="cart-item">
      <div class="thumb" style="background:${p.grad}">${p.emoji}</div>
      <div class="info">
        <b>${p.name}</b>
        <span class="opts">${e.size} · <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${e.color};vertical-align:middle;border:1px solid #334155"></span></span>
        <div class="qty">
          <button data-dec="${i}">−</button><span>${e.qty}</span><button data-inc="${i}">+</button>
        </div>
      </div>
      <div class="right">
        <div class="price">₱${p.price*e.qty}</div>
        <button class="remove" data-rm="${i}">Remove</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('cartTotal').textContent='₱'+total;

  el.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{state.cart[Object.keys(state.cart)[+b.dataset.inc]].qty++;updateCart();});
  el.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{
    const k=Object.keys(state.cart)[+b.dataset.dec];
    state.cart[k].qty--;
    if(state.cart[k].qty<=0)delete state.cart[k];
    updateCart();
  });
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{delete state.cart[Object.keys(state.cart)[+b.dataset.rm]];updateCart();});
}

// Cart panel
const cartPanel=document.getElementById('cartPanel');
const overlay=document.getElementById('overlay');
function openCart(){cartPanel.classList.add('open');overlay.classList.add('show');}
function closeCart(){cartPanel.classList.remove('open');overlay.classList.remove('show');}
document.getElementById('cartBtn').onclick=openCart;
document.getElementById('wishBtn').onclick=()=>alert(`You have ${state.wish.size} item(s) in your wishlist.`);
document.getElementById('cartClose').onclick=closeCart;
overlay.onclick=closeCart;
document.getElementById('checkoutBtn').onclick=()=>{
  if(!Object.keys(state.cart).length){alert('Your cart is empty.');return;}
  alert('Checkout complete! (demo)');
  state.cart={};updateCart();closeCart();
};

// Filters
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.cat=b.dataset.cat;render();
});
document.getElementById('searchInput').oninput=e=>{state.q=e.target.value.toLowerCase();render();};
document.getElementById('sortSelect').onchange=e=>{state.sort=e.target.value;render();};

render();
</script>
</body>
</html>
